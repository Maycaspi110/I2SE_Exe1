<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33414c"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fbe3e5"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c4424d" stroke-width="2"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb0bb"/>
      <stop offset="1" stop-color="#46555f"/>
    </linearGradient>
  </defs>

  <rect width="900" height="540" rx="14" fill="#f6f8fa" stroke="#d3dce2"/>
  <text x="30" y="42" font-size="20" font-weight="600" fill="#15202a">plane-projection-3d: slicing a 3D scan along a plane</text>

  <!-- ===== 3D matrix M ===== -->
  <!-- hidden edges -->
  <g stroke="#8a97a1" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="260" y1="250" x2="407" y2="335"/>
    <line x1="260" y1="250" x2="113" y2="335"/>
    <line x1="260" y1="250" x2="260" y2="80"/>
  </g>
  <!-- faces -->
  <polygon points="260,80 407,165 260,250 113,165" fill="#dfe8ee" stroke="#33414c" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="113,165 260,250 260,420 113,335" fill="#c3d1da" stroke="#33414c" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="260,250 407,165 407,335 260,420" fill="#b0c1cc" stroke="#33414c" stroke-width="2" stroke-linejoin="round"/>

  <!-- voxel grid hint on the top face -->
  <g stroke="#33414c" stroke-opacity=".25" stroke-width="1">
    <line x1="186" y1="122" x2="333" y2="207"/><line x1="223" y1="101" x2="370" y2="186"/>
    <line x1="297" y1="101" x2="150" y2="186"/><line x1="334" y1="122" x2="187" y2="207"/>
  </g>

  <!-- plane p -->
  <polygon points="275,140 348,182 297,390 120,288" fill="#d9921a" fill-opacity=".55" stroke="#a8670f" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#a8670f">
    <circle cx="275" cy="140" r="5"/><circle cx="348" cy="182" r="5"/>
    <circle cx="297" cy="390" r="5"/><circle cx="120" cy="288" r="5"/>
  </g>
  <g font-size="16" font-weight="600" fill="#6b4208">
    <text x="262" y="132">a</text><text x="357" y="184">b</text>
    <text x="306" y="402">c</text><text x="102" y="284">d</text>
  </g>

  <!-- axes labels and sizes -->
  <g font-size="15" fill="#33414c" font-weight="600">
    <text x="418" y="346">X</text><text x="88" y="346">Y</text><text x="254" y="68">Z</text>
  </g>
  <text x="260" y="452" text-anchor="middle" font-size="16" fill="#15202a" font-weight="600">M  (sx × sy × sz)</text>
  <text x="260" y="474" text-anchor="middle" font-size="13" fill="#596773">3D scan, 8 / 16 / 32-bit unsigned values, each side &lt; 2¹⁰</text>
  <text x="95" y="395" font-size="13" fill="#a8670f" font-weight="600">plane p</text>
  <text x="35" y="413" font-size="12" fill="#596773">(3 points: isosceles triangle,</text>
  <text x="35" y="429" font-size="12" fill="#596773"> 4 points: isosceles trapezoid)</text>

  <!-- ===== arrow ===== -->
  <path d="M430 250 C 480 240, 520 235, 565 235" fill="none" stroke="#33414c" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="497" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#33414c">sample M</text>
  <text x="497" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#33414c">along p</text>

  <!-- ===== 2D image E ===== -->
  <rect x="590" y="140" width="250" height="190" fill="url(#scan)" stroke="#33414c" stroke-width="2"/>
  <ellipse cx="715" cy="215" rx="70" ry="48" fill="#dfe8ee" fill-opacity=".55"/>
  <ellipse cx="695" cy="208" rx="16" ry="22" fill="#2a343c" fill-opacity=".6"/>
  <ellipse cx="735" cy="208" rx="16" ry="22" fill="#2a343c" fill-opacity=".6"/>
  <polygon points="590,330 590,262 650,330" fill="url(#hatch)" stroke="#c4424d" stroke-width="1.5"/>
  <polygon points="840,330 840,262 780,330" fill="url(#hatch)" stroke="#c4424d" stroke-width="1.5"/>
  <g font-size="16" font-weight="600" fill="#6b4208">
    <text x="578" y="136" text-anchor="end">a</text><text x="852" y="136">b</text>
    <text x="578" y="352" text-anchor="end">d</text><text x="852" y="352">c</text>
  </g>
  <text x="715" y="378" text-anchor="middle" font-size="16" fill="#15202a" font-weight="600">E  (W × H)</text>
  <text x="715" y="398" text-anchor="middle" font-size="13" fill="#596773">2D projected image, one per plane</text>
  <rect x="598" y="414" width="14" height="14" fill="url(#hatch)" stroke="#c4424d"/>
  <text x="620" y="426" font-size="13" fill="#c4424d" font-weight="600">sample falls outside M, value = 0</text>

  <!-- ===== video strip ===== -->
  <line x1="30" y1="494" x2="870" y2="494" stroke="#d3dce2"/>
  <text x="30" y="520" font-size="14" fill="#15202a"><tspan font-weight="600">file.csv</tspan> row 1, 2, 3, … (a plane each)  →  frames E₁, E₂, E₃, …  →  <tspan font-weight="600">file.mp4</tspan>   (goal: 30 FPS minimum, 100+ FPS ideal)</text>
</svg>
